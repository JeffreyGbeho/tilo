Dir { ArchiveDir "./public"; };
Default { Packages::Compress ". gzip"; };
TreeDefault {
  Directory        "pool/$(SECTION)";
  BinaryDir        "pool/$(SECTION)";
  Packages         "$(DIST)/$(SECTION)/binary-$(ARCH)/Packages";
  // Contents files list every path in every package. They are only useful for
  // apt-file on a large archive, and generating them here fails on a one
  // package repository, so turn them off.
  Contents         " ";
};
Tree "dists/stable" {
  Sections   "main";
  Architectures "all";
};
