Dir {
  ArchiveDir "./public";
  // Without this, apt-ftparchive tries to open its cache at the filesystem
  // root and prints a permission error on every run. It carries on without a
  // cache, but the error is noise in an otherwise clean build.
  CacheDir "./build/apt-cache";
};
Default { Packages::Compress ". gzip"; };
TreeDefault {
  Directory        "pool/$(SECTION)";
  BinaryDir        "pool/$(SECTION)";
  Packages         "$(DIST)/$(SECTION)/binary-$(ARCH)/Packages";
  // Contents files list every path in every package. They are only useful for
  // apt-file on a large archive, and generating them here fails on a one
  // package repository, so turn them off.
  Contents         " ";
};
Tree "dists/stable" {
  Sections   "main";
  Architectures "all";
};
